<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hoạt Động & Sự Kiện - Dormex KTX</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-hotel"></i></div>
                <div>DORM<span>EX</span></div>
            </div>
            <span>BQL</span>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-label">Tổng Quan</div>
            <a href="index.html" class="sidebar-item"><i class="fa-solid fa-chart-pie"></i> Bảng Điều Khiển</a>
            <div class="menu-label" style="margin-top: 1rem;">Nghiệp Vụ KTX</div>
            <a href="users.html" class="sidebar-item"><i class="fa-solid fa-users"></i> Quản Lý Sinh Viên</a>
            <a href="registrations.html" class="sidebar-item"><i class="fa-solid fa-file-signature"></i> Đơn Đăng Ký Phòng</a>
            <a href="rooms.html" class="sidebar-item"><i class="fa-solid fa-bed"></i> Quản Lý Quỹ Phòng</a>
            <a href="billing.html" class="sidebar-item"><i class="fa-solid fa-file-invoice-dollar"></i> Quản Lý Hóa Đơn</a>
            <a href="maintenance.html" class="sidebar-item"><i class="fa-solid fa-screwdriver-wrench"></i> Bảo Trì - Sửa Chữa</a>
            <div class="menu-label" style="margin-top: 1rem;">Truyền Thông & Quy Chế</div>
            <a href="announcements.html" class="sidebar-item"><i class="fa-solid fa-bullhorn"></i> Thông Báo KTX</a>
            <a href="events.html" class="sidebar-item active"><i class="fa-solid fa-calendar-days"></i> Quản Lý Sự Kiện</a>
            <a href="rules.html" class="sidebar-item"><i class="fa-solid fa-gavel"></i> Nội Quy KTX</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-snippet">
                <div class="user-avatar"><i class="fa-solid fa-user-shield"></i></div>
                <div class="user-meta">
                    <div class="name user-display-name">Ban Quản Lý</div>
                    <div class="role">Admin Hệ Thống</div>
                </div>
                <button onclick="DormexDB.logout()" class="btn-action" title="Đăng xuất" style="color: var(--danger);"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
            </div>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-title">
                <h1>Quản Lý Sự Kiện & Phong Trào Ngoại Khóa</h1>
            </div>
            <div class="topbar-actions">
                <button onclick="openModal('eventModal')" class="btn btn-primary"><i class="fa-solid fa-calendar-plus"></i> Tạo Sự Kiện Mới</button>
            </div>
        </header>

        <div class="admin-body">
            <div id="adminEventsList">
                <!-- Render dynamically -->
            </div>
        </div>
    </main>

    <!-- MODAL TẠO SỰ KIỆN -->
    <div id="eventModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Thêm Sự Kiện KTX Mới</h3>
                <button class="modal-close" onclick="closeModal('eventModal')">&times;</button>
            </div>
            <form id="eventForm" onsubmit="handleCreateEvent(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Tên chương trình / sự kiện *</label>
                        <input type="text" id="evTitle" class="form-control" required placeholder="Ví dụ: Hội thao bóng đá KTX...">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Thời gian diễn ra *</label>
                            <input type="text" id="evDate" class="form-control" required placeholder="20/10/2024 18:30">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Địa điểm tổ chức *</label>
                            <input type="text" id="evLocation" class="form-control" required placeholder="Quảng trường KTX / Tòa B">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Đơn vị tổ chức</label>
                            <input type="text" id="evOrganizer" class="form-control" placeholder="Đoàn Thanh Niên KTX" value="Đoàn Thanh Niên KTX">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Giới hạn sinh viên tham gia</label>
                            <input type="number" id="evCapacity" class="form-control" value="200" min="10">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mô tả chương trình</label>
                        <textarea id="evDescription" class="form-control" placeholder="Nội dung, phần quà, điều kiện tham gia..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal('eventModal')">Hủy</button>
                    <button type="submit" class="btn btn-primary">Tạo Sự Kiện</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/data-store.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth('admin');
            renderEventsAdmin();
        });
    </script>
</body>
</html>
