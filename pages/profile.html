<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân Sinh Viên - Dormex</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="student-layout">

    <header class="portal-nav">
        <div class="portal-container">
            <div class="portal-bar">
                <a href="../index.html" class="brand-logo">
                    <div class="logo-icon"><i class="fa-solid fa-hotel"></i></div>
                    <div>DORM<span>EX</span></div>
                </a>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700;">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <div>
                            <strong style="font-size: 0.92rem; color: #0f172a;" class="user-display-name">Sinh Viên</strong>
                            <small style="display: block; color: var(--text-muted); font-size: 0.78rem;" class="user-display-role">Cổng Sinh Viên</small>
                        </div>
                    </div>
                    <button onclick="DormexDB.logout()" class="btn btn-sm btn-outline" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">
                        <i class="fa-solid fa-power-off"></i> Đăng Xuất
                    </button>
                </div>
            </div>

            <nav class="portal-menu">
                <a href="home.html" class="portal-menu-link"><i class="fa-solid fa-house-chimney"></i> Trang Chủ</a>
                <a href="profile.html" class="portal-menu-link active"><i class="fa-solid fa-id-card"></i> Hồ Sơ Sinh Viên</a>
                <a href="registration.html" class="portal-menu-link"><i class="fa-solid fa-file-pen"></i> Đăng Ký Phòng</a>
                <a href="rooms.html" class="portal-menu-link"><i class="fa-solid fa-bed"></i> Tra Cứu Phòng</a>
                <a href="billing.html" class="portal-menu-link"><i class="fa-solid fa-file-invoice-dollar"></i> Hóa Đơn & Tiền Phòng</a>
                <a href="maintenance.html" class="portal-menu-link"><i class="fa-solid fa-screwdriver-wrench"></i> Báo Hỏng Sửa Chữa</a>
                <a href="announcements.html" class="portal-menu-link"><i class="fa-solid fa-bullhorn"></i> Thông Báo</a>
                <a href="events.html" class="portal-menu-link"><i class="fa-solid fa-calendar-star"></i> Sự Kiện KTX</a>
                <a href="rules.html" class="portal-menu-link"><i class="fa-solid fa-shield-halved"></i> Nội Quy</a>
                <a href="map.html" class="portal-menu-link"><i class="fa-solid fa-map-location-dot"></i> Bản Đồ</a>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width: 800px; padding-top: 2.5rem;">
        <div class="card" style="padding: 2.5rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color);">
                <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 3px solid var(--primary-border);">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div>
                    <h2 style="font-size: 1.6rem; font-weight: 800; color: #0369a1;" class="user-display-name">Sinh Viên</h2>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Phòng đang ở: <strong id="profileRoomText" style="color: var(--primary);">Đang tải...</strong></p>
                </div>
            </div>

            <form onsubmit="handleSaveProfile(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                    <div class="form-group">
                        <label class="form-label">Họ và tên sinh viên</label>
                        <input type="text" id="profileFullName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mã số sinh viên (MSSV)</label>
                        <input type="text" id="profileCode" class="form-control" disabled style="background: #f1f5f9; cursor: not-allowed;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                    <div class="form-group">
                        <label class="form-label">Địa chỉ Email</label>
                        <input type="email" id="profileEmail" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại liên hệ</label>
                        <input type="tel" id="profilePhone" class="form-control" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                    <div class="form-group">
                        <label class="form-label">Lớp sinh hoạt / Khoa</label>
                        <input type="text" id="profileClass" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Giới tính</label>
                        <select id="profileGender" class="form-control">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                </div>

                <div style="background: var(--primary-ultra-light); border: 1px solid var(--primary-border); border-radius: var(--radius-md); padding: 1.25rem; margin: 1.5rem 0;">
                    <h4 style="font-size: 1rem; color: #0369a1; margin-bottom: 0.5rem;"><i class="fa-solid fa-lock"></i> Đổi mật khẩu đăng nhập</h4>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">Để trống nếu không muốn thay đổi mật khẩu hiện tại.</p>
                    <input type="password" id="profilePassword" class="form-control" placeholder="Nhập mật khẩu mới (nếu muốn đổi)...">
                </div>

                <button type="submit" class="btn btn-primary" style="padding: 0.85rem 2rem;">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi
                </button>
            </form>
        </div>
    </main>

    <script src="../assets/js/data-store.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/student.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth('student');
            initStudentProfile();
        });
    </script>
</body>
</html>
