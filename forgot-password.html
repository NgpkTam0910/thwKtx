<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Dormex</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #ffffff 100%); min-height: 100vh; display: flex; flex-direction: column;">

    <div style="padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-hotel"></i></div>
            <div>DORM<span>EX</span></div>
        </a>
        <a href="login.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Quay lại Đăng Nhập</a>
    </div>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
        <div class="card" style="width: 100%; max-width: 460px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem;">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 style="font-size: 1.6rem; font-weight: 800; color: #0369a1;">Khôi Phục Mật Khẩu</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Nhập email hoặc mã sinh viên để đặt lại mật khẩu</p>
            </div>

            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label" for="recoveryInput"><i class="fa-solid fa-envelope"></i> Email hoặc Tên đăng nhập</label>
                    <input type="text" id="recoveryInput" class="form-control" placeholder="admin hoặc minhtam@dormex.edu.vn" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="newPasswordInput"><i class="fa-solid fa-lock"></i> Mật khẩu mới</label>
                    <input type="password" id="newPasswordInput" class="form-control" placeholder="Nhập mật khẩu mới..." required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">
                    <i class="fa-solid fa-rotate-right"></i> Cập Nhật Mật Khẩu
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Nhớ mật khẩu rồi? <a href="login.html" style="font-weight: 700; color: var(--primary);">Đăng nhập ngay</a>
            </div>
        </div>
    </main>

    <script src="assets/js/data-store.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('recoveryInput').value.trim();
            const newPass = document.getElementById('newPasswordInput').value;

            // Tìm trong users
            let users = JSON.parse(localStorage.getItem('dormex_users')) || [];
            const user = users.find(u => u.username.toLowerCase() === val.toLowerCase() || u.email.toLowerCase() === val.toLowerCase());

            if (user) {
                user.password = newPass;
                localStorage.setItem('dormex_users', JSON.stringify(users));
                showToast(`Đặt lại mật khẩu thành công cho tài khoản ${user.username}!`, 'success');
                setTimeout(() => window.location.href = 'login.html', 1200);
            } else {
                showToast('Không tìm thấy tài khoản tương ứng trên hệ thống!', 'danger');
            }
        });
    </script>
</body>
</html>
