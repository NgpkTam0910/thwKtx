<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống - Dormex Ký Túc Xá</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .loading-bar {
            height: 3px;
            width: 100%;
            background: #e0f2fe;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            display: none;
        }
        .loading-bar-inner {
            height: 100%;
            width: 50%;
            background: #0284c7;
            animation: loadingProgress 1s infinite linear;
        }
        @keyframes loadingProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #ffffff 100%); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- TOPBAR RÚT GỌN -->
    <div style="padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-hotel"></i></div>
            <div>DORM<span>EX</span></div>
        </a>
        <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-house"></i> Về Trang Chủ</a>
    </div>

    <!-- MAIN FORM -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
        <div class="card" style="width: 100%; max-width: 460px; padding: 2.5rem; box-shadow: var(--shadow-lg); position: relative;">
            
            <!-- THANH TIẾN TRÌNH LOADING -->
            <div class="loading-bar" id="loginProgressBar">
                <div class="loading-bar-inner"></div>
            </div>

            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem;">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 style="font-size: 1.6rem; font-weight: 800; color: #0369a1;">Đăng Nhập Hệ Thống</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Quản lý lưu trú & Dịch vụ sinh viên KTX</p>
            </div>

            <!-- HỘP THÔNG BÁO LỖI NẾU CÓ -->
            <div id="loginAlertBox" style="display: none; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username"><i class="fa-solid fa-user"></i> Tên đăng nhập / Mã sinh viên</label>
                    <input type="text" id="username" class="form-control" placeholder="Ví dụ: admin hoặc sv_minhtam" required autofocus>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
                        <label class="form-label" for="password" style="margin: 0;"><i class="fa-solid fa-key"></i> Mật khẩu</label>
                        <a href="forgot-password.html" style="font-size: 0.82rem; color: var(--primary);">Quên mật khẩu?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập Ngay
                </button>
            </form>

            <!-- HỘP TÀI KHOẢN MẪU DEMO (DÀNH CHO CHẤM BÀI / TRẢI NGHIỆM NHANH) -->
            <div style="margin-top: 2rem; padding: 1rem; background: var(--primary-ultra-light); border: 1px dashed var(--primary-border); border-radius: var(--radius-md); font-size: 0.85rem;">
                <div style="font-weight: 700; color: #0369a1; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-lightbulb"></i> Bấm để tự động điền & đăng nhập ngay:
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-sm btn-outline" onclick="quickLogin('admin', 'admin123')" style="background: #ffffff;">
                        <i class="fa-solid fa-user-shield"></i> Admin: admin
                    </button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="quickLogin('sv_minhtam', '123456')" style="background: #ffffff;">
                        <i class="fa-solid fa-graduation-cap"></i> SV: sv_minhtam
                    </button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Chưa có tài khoản? <a href="register.html" style="font-weight: 700; color: var(--primary);">Đăng ký tài khoản mới</a>
            </div>
        </div>
    </main>

    <script src="assets/js/data-store.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Điền nhanh tài khoản
        function quickLogin(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            doLogin(u, p);
        }

        // Hàm thực hiện đăng nhập với hiệu ứng Loading trực quan
        async function doLogin(u, p) {
            const btn = document.getElementById('loginSubmitBtn');
            const pBar = document.getElementById('loginProgressBar');
            const alertBox = document.getElementById('loginAlertBox');

            // Ẩn thông báo lỗi cũ
            alertBox.style.display = 'none';

            // Kích hoạt trạng thái LOADING
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng nhập...`;
            btn.style.opacity = '0.85';
            pBar.style.display = 'block';

            try {
                const res = await DormexDB.login(u, p);

                if (res && res.success) {
                    // Thành công: Đổi icon sang tích xanh
                    btn.className = 'btn btn-success';
                    btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Đăng nhập thành công!`;
                    btn.style.background = '#10b981';

                    showToast(`Xin chào ${res.user.full_name}! Đang tải trang...`, 'success');

                    // Chuyển hướng trang
                    const targetPage = res.user.role === 'admin' ? 'admin/index.html' : 'pages/home.html';
                    setTimeout(() => {
                        window.location.href = targetPage;
                    }, 500);

                } else {
                    // Thất bại: Phục hồi nút bấm
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập Ngay`;
                    btn.style.opacity = '1';
                    pBar.style.display = 'none';

                    const errMsg = (res && res.message) ? res.message : 'Tài khoản hoặc mật khẩu không chính xác!';
                    alertBox.style.display = 'block';
                    alertBox.style.background = '#fef2f2';
                    alertBox.style.border = '1px solid #fecaca';
                    alertBox.style.color = '#dc2626';
                    alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${errMsg}`;

                    showToast(errMsg, 'danger');
                }
            } catch (err) {
                console.error('Lỗi đăng nhập:', err);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập Ngay`;
                btn.style.opacity = '1';
                pBar.style.display = 'none';

                alertBox.style.display = 'block';
                alertBox.style.background = '#fef2f2';
                alertBox.style.border = '1px solid #fecaca';
                alertBox.style.color = '#dc2626';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Có lỗi xảy ra trong quá trình đăng nhập. Vui lòng thử lại!`;

                showToast('Có lỗi xảy ra, vui lòng thử lại!', 'danger');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            doLogin(u, p);
        });
    </script>
</body>
</html>
